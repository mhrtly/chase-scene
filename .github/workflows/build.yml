name: Build & test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture UI screenshots to the ci-screenshots branch
        type: boolean
        default: false
      settings_y:
        description: Screen y of the Settings menu row (0 = skip the submenu shot)
        type: string
        default: "0"
      release:
        description: Publish a release with this tag (e.g. v1.0.0) after the tests pass
        type: string
        default: ""

permissions:
  contents: write   # publish releases from version tags (and optional screenshots)

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build the app (universal)
        run: |
          bash build.sh 2>&1 | tee build-output.txt
          if grep -q "warning:" build-output.txt; then
            grep "warning:" build-output.txt | sort -u | sed 's/^/::warning::/'
          fi

      - name: Core tests
        run: |
          swiftc -swift-version 5 -module-cache-path build/module-cache \
            Sources/Core.swift Sources/Credits.swift Sources/IPC.swift Sources/Hooks.swift Sources/JSON.swift Sources/Integrations.swift \
            tests/main.swift -o build/core-tests
          build/core-tests | tee build/core-tests.txt
          echo "::notice title=Core tests::$(tail -1 build/core-tests.txt)"

      - name: Integration tests
        run: |
          swiftc -swift-version 5 -module-cache-path build/module-cache tests/post_mouse.swift -o build/post-mouse
          set +e
          python3 tests/integration.py > build/integration.txt 2>&1
          status=$?
          set -e
          cat build/integration.txt
          summary="$(grep -E ' \.\.\. |^Ran |^OK|^FAILED' build/integration.txt | sed -E 's/ \(__main__[^)]*\)//')"
          summary="${summary//'%'/'%25'}"
          echo "::notice title=Integration tests::${summary//$'\n'/'%0A'}"
          exit $status

      - name: Inspect the bundle
        run: |
          archs="$(lipo -archs "build/Benny Hill Climber.app/Contents/MacOS/ChaseScene")"
          codesign --verify --verbose "build/Benny Hill Climber.app"
          size="$(du -sh "build/Benny Hill Climber.app" | cut -f1)"
          echo "::notice title=Bundle::architectures: $archs, size: $size"

      - name: UI screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          SETTINGS_Y="${{ inputs.settings_y }}" bash tests/screenshots.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq --cached .
          cp build/screenshots/* .
          git add ./*.png ./*.txt
          git commit -qm "UI screenshots from CI"
          git push -fq origin ci-screenshots

      - name: Package
        run: |
          ditto -c -k --keepParent "build/Benny Hill Climber.app" build/Benny-Hill-Climber.zip
          # Previously shared installers and download links still expect this filename.
          mkdir -p build/legacy
          ditto "build/Benny Hill Climber.app" "build/legacy/Chase Scene.app"
          ditto -c -k --keepParent "build/legacy/Chase Scene.app" build/Chase-Scene.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Benny-Hill-Climber
          path: build/Benny-Hill-Climber.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        run: |
          gh release create "$TAG" build/Benny-Hill-Climber.zip "build/Chase-Scene.zip#Compatibility for older installers" --target "$GITHUB_SHA" \
            --title "Benny Hill Climber $TAG" --notes-file .github/release-notes.md
